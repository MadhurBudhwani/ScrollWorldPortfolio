<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Explore Madhur's worlds | Madhur Budhwani</title>
<meta name="description" content="Build a backend, guide an AI question, and explore architecture, security, creativity and the person behind the systems."/>
<link rel="icon" type="image/svg+xml" href="./favicon.svg"/>
<style>
  :root{
    --bg:#070f17; --bg2:#0b1a25;
    --teal:#67daf5; --mint:#84f5ad; --gold:#f3cc70; --pink:#f58caf; --violet:#bf8cff;
    --ink:#e6f2f0; --dim:#8fb0b8;
    --mono:"SFMono-Regular",Consolas,"Roboto Mono",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif}
  body{position:fixed;inset:0;display:flex;justify-content:center}
  button,a{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  button{font:inherit}
  :focus-visible{outline:2px solid var(--teal);outline-offset:4px}
  .device{position:relative;width:100%;max-width:540px;height:100%;height:100dvh;overflow:hidden;
    background:radial-gradient(120% 80% at 80% -10%,#153244 0,transparent 55%),var(--bg)}
  /* CRT scanlines + vignette */
  .crt{position:absolute;inset:0;pointer-events:none;z-index:60;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px);
    mix-blend-mode:multiply;opacity:.5}
  .vignette{position:absolute;inset:0;pointer-events:none;z-index:59;
    box-shadow:inset 0 0 140px 30px #000a;}

  /* ---------- BOOT ---------- */
  #boot{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;justify-content:center;
    padding:28px 22px;font-family:var(--mono);font-size:13px;line-height:1.85;letter-spacing:.1px;
    transition:opacity .5s ease,transform .6s ease}
  #boot.gone{opacity:0;transform:scale(1.04);pointer-events:none}
  #boot .top{color:var(--mint);font-size:13px;margin-bottom:14px;text-shadow:0 0 12px #84f5ad66}
  #boot .top b{color:var(--teal)}
  #bootlog{white-space:pre-wrap;color:#bfe6e0;min-height:230px}
  #bootlog .ok{color:var(--mint)} #bootlog .val{color:var(--gold)} #bootlog .warn{color:var(--pink)}
  #bootlog .ready{color:var(--teal);font-size:16px;text-shadow:0 0 16px #67daf5aa}
  .cursor{display:inline-block;width:9px;height:16px;background:var(--teal);vertical-align:-2px;
    box-shadow:0 0 10px var(--teal);animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .skip{position:absolute;bottom:max(20px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);min-height:44px;min-width:140px;text-align:center;color:var(--dim);font-size:12px;letter-spacing:2px;background:transparent;border:1px solid #2c4a56;border-radius:8px;cursor:pointer}

  /* ---------- HUB ---------- */
  #hub{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;padding:max(18px,env(safe-area-inset-top)) 16px max(12px,env(safe-area-inset-bottom));
    opacity:0;transform:translateY(14px);transition:opacity .6s ease .05s,transform .6s ease .05s;pointer-events:none}
  #hub.show{opacity:1;transform:none;pointer-events:auto}
  .hubhead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px}
  .hubhead .os{font-family:var(--mono);font-size:12px;letter-spacing:3px;color:var(--dim)}
  .hubhead .os b{color:var(--teal)}
  .hubhead .live{font-family:var(--mono);font-size:10px;color:var(--mint);letter-spacing:1px}
  .hubhead .live i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--mint);
    box-shadow:0 0 8px var(--mint);margin-right:5px;animation:blink 1.6s infinite}
  .prompt{font-family:var(--mono);font-size:13px;color:var(--teal);margin:8px 2px 12px;text-shadow:0 0 10px #67daf544}
  .prompt .c{color:var(--gold)}
  .tiles{display:flex;flex-direction:column;gap:12px;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:5px 5px 16px;scrollbar-width:thin;scrollbar-color:#375660 transparent;-webkit-overflow-scrolling:touch}
  .hubfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 5px 0;font-size:12px;color:var(--dim)}
  .hubfoot a{color:var(--teal);min-height:36px;display:flex;align-items:center;text-underline-offset:4px}

  .tile{position:relative;display:flex;flex-shrink:0;align-items:center;gap:13px;padding:17px 15px;border-radius:14px;
    text-align:left;text-decoration:none;cursor:pointer;color:var(--ink);
    background:linear-gradient(135deg,#12283499,#0c1a24ee);
    border:1px solid #24424f;border-left:3px solid var(--ac);
    box-shadow:0 6px 22px #0007, inset 0 0 0 1px #ffffff08;
    transition:transform .16s ease,box-shadow .2s ease,border-color .2s ease}
  .tile:active{transform:scale(.985)}
  .tile:hover{border-color:var(--ac);box-shadow:0 8px 30px #0009,0 0 22px -6px var(--ac),inset 0 0 24px -12px var(--ac)}
  .tile.sig{padding:19px 15px}
  .tile.is-suggested{border-color:var(--ac);box-shadow:0 0 22px -10px var(--ac),inset 0 0 25px -15px var(--ac)}
  .glyph{flex:none;width:52px;height:52px;border-radius:12px;display:grid;place-items:center;position:relative;
    background:radial-gradient(circle at 50% 35%,var(--ac) -40%,#0a1620 70%);
    border:1px solid var(--ac);box-shadow:0 0 18px -4px var(--ac),inset 0 0 14px -6px var(--ac)}
  .glyph svg{width:30px;height:30px}
  .meta{min-width:0;flex:1}
  .meta .name{font-size:19px;font-weight:700;letter-spacing:.1px;line-height:1.2}
  .meta .world{font-family:var(--mono);font-size:11px;line-height:1.55;letter-spacing:.55px;text-transform:uppercase;color:var(--ac);margin:6px 0}
  .meta .tag{font-size:14px;color:#b4cbd1;line-height:1.5}
  .meta .hint{margin-top:9px;font-size:12.5px;line-height:1.45;color:var(--ac);opacity:.96}
  .meta .hint:before{content:"›  "}
  .chev{flex:none;color:var(--ac);opacity:.7;font-size:20px}
  .badge{position:absolute;top:9px;right:13px;font-family:var(--mono);font-size:9px;letter-spacing:1px;
    color:var(--bg);background:var(--ac);padding:2px 7px;border-radius:20px;font-weight:700}
  .divider{display:flex;align-items:center;gap:10px;margin:6px 2px 2px;color:var(--dim);
    font-family:var(--mono);font-size:10px;letter-spacing:2px}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,#2c4a56,transparent)}
  .tile.mini{padding:12px 15px}
  .tile.mini .glyph{width:42px;height:42px;border-radius:10px}
  .tile.mini .glyph svg{width:24px;height:24px}
  .tile.mini .name{font-size:18px}

  /* enter overlay */
  #enter{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
    background:#050b12f2;opacity:0;pointer-events:none;transition:opacity .3s ease;font-family:var(--mono);padding:30px;text-align:center}
  #enter.show{opacity:1;pointer-events:auto}
  #enter .big{font-size:22px;line-height:1.4;letter-spacing:1px;text-shadow:0 0 16px var(--ac,#67daf5);color:var(--ac,#67daf5)}
  #enter .sub{color:var(--dim);font-size:14px;line-height:1.6;max-width:28ch}
  #enter .bar{width:190px;height:6px;border-radius:4px;background:#16303c;overflow:hidden}
  #enter .bar i{display:block;height:100%;width:0;background:var(--ac,#67daf5);box-shadow:0 0 12px var(--ac,#67daf5);animation:fill .65s ease forwards}
  @keyframes fill{to{width:100%}}
  #enter .back{margin-top:6px;min-height:44px;background:transparent;color:var(--dim);font-size:12px;letter-spacing:1px;border:1px solid #2c4a56;border-radius:8px;padding:10px 16px;cursor:pointer}
  .tileStagger{opacity:0;transform:translateY(10px)}
  @media(max-width:360px){#hub{padding-inline:10px}.glyph{width:42px;height:42px}.glyph svg{width:26px;height:26px}.tile{gap:10px;padding-inline:12px}.tile.sig{padding-inline:12px}.chev{display:none}#boot{padding-inline:16px;font-size:12px}}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.tileStagger{opacity:1;transform:none}.cursor{opacity:1}}
</style>
</head>
<body>
<div class="device">
  <div class="vignette"></div>
  <div class="crt"></div>

  <section id="boot" aria-label="Starting Madhur's worlds">
    <div class="top">MADHUR_OS <b>v5.0</b> — GenAI &amp; Backend Engineer</div>
    <div id="bootlog"></div>
    <button class="skip" type="button">SKIP INTRO</button>
  </section>

  <section id="hub" aria-label="Choose a world" inert>
    <div class="hubhead">
      <div class="os">MADHUR<b>//</b>OS</div>
      <div class="live"><i></i>SYSTEM READY</div>
    </div>
    <div class="prompt">&gt; select a world<span class="c">_</span></div>
    <nav class="tiles" id="tiles" aria-label="Madhur's worlds"></nav>
    <footer class="hubfoot"><span>Explore at your pace.</span><a href="./index.html?experience=desktop#hub">Desktop journey ↗</a></footer>
  </section>

  <section id="enter" aria-label="Opening world" inert>
    <div class="big" id="enterName">BOOTING</div>
    <div class="sub" id="enterSub">initializing world…</div>
    <div class="bar"><i></i></div>
    <button type="button" class="back" id="enterBack">← BACK TO HUB</button>
  </section>
</div>

<script>
(() => {
  const bootlog = document.getElementById('bootlog');
  const boot = document.getElementById('boot');
  const hub = document.getElementById('hub');
  const enter = document.getElementById('enter');
  const enterBack = document.getElementById('enterBack');
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const params = new URLSearchParams(location.search);
  const session = {
    get(key){ try { return sessionStorage.getItem(key); } catch { return null; } },
    set(key,value){ try { sessionStorage.setItem(key,value); } catch {} }
  };
  const requestedTile = ['boot','trace','gyro','hobby','about'].includes(params.get('focus')) ? params.get('focus') : null;

  const lines = [
    ['POST . . . . . . . . . . . . . . ', 'OK', 'ok'],
    ['kernel  .NET 10 / C# / ASP.NET . . ', 'OK', 'ok'],
    ['data    SQL Server · EF Core  . . ', 'OK', 'ok'],
    ['cache   Redis . . . . . . . . . . ', 'OK', 'ok'],
    ['cloud   Azure uplink  . . . . . . ', 'OK', 'ok'],
    ['secure  RLS · SESSION_CONTEXT . . ', 'ARMED', 'val'],
    ['', '', ''],
    ['5+ years · 1,200+ commits · 400+ PRs', '', 'val'],
  ];

  let i = 0, skipped = false, bootTimer, worldTimer, activeTile = null;
  function typeLine(){
    if (skipped) return;
    if (i >= lines.length){ ready(); return; }
    const [txt, tag, cls] = lines[i++];
    const span = document.createElement('div');
    span.innerHTML = txt + (tag ? `<span class="${cls}">${tag}</span>` : (cls==='val'?`<span class="val"></span>`:''));
    if (cls==='val' && !tag) span.className='val';
    bootlog.appendChild(span);
    bootlog.scrollTop = bootlog.scrollHeight;
    bootTimer = setTimeout(typeLine, txt ? 240 : 120);
  }
  function ready(){
    const r = document.createElement('div');
    r.innerHTML = `<span class="ready">SYSTEM READY</span> <span class="cursor"></span>`;
    bootlog.appendChild(r);
    bootTimer = setTimeout(showHub, 780);
  }
  function showHub(){
    if (hub.classList.contains('show')) return;
    clearTimeout(bootTimer);
    skipped = true;
    boot.classList.add('gone');
    boot.inert = true;
    hub.classList.add('show');
    hub.inert = false;
    buildTiles();
    session.set('mobile-hub-ready', '1');
    if (boot.contains(document.activeElement)) document.querySelector('#tiles .tile')?.focus({preventScroll:true});
  }
  function skip(){ if(skipped)return; skipped=true; showHub(); }
  boot.addEventListener('click', skip);

  const S = {
    server:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="3" width="16" height="6" rx="1.5"/><rect x="4" y="11" width="16" height="6" rx="1.5"/><circle cx="8" cy="6" r=".9" fill="currentColor" stroke="none"/><circle cx="8" cy="14" r=".9" fill="currentColor" stroke="none"/></svg>',
    packet:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3l7 4v10l-7 4-7-4V7z"/><path d="M12 3v18M5 7l7 4 7-4"/></svg>',
    gyro:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8"/><ellipse cx="12" cy="12" rx="8" ry="3.4"/><ellipse cx="12" cy="12" rx="3.4" ry="8"/></svg>',
    art:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8.5"/><circle cx="8.5" cy="9.5" r="1.1" fill="currentColor" stroke="none"/><circle cx="15" cy="9" r="1.1" fill="currentColor" stroke="none"/><circle cx="15.5" cy="14" r="1.1" fill="currentColor" stroke="none"/></svg>',
    star:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3l2.2 5.6L20 10l-4.5 3.4L17 20l-5-3.2L7 20l1.5-6.6L4 10l5.8-1.4z"/></svg>',
  };

  const worlds = [
    {k:"boot",  cls:"sig", name:"Backend & Cloud", contents:".NET 10 · SQL SERVER · AZURE · REDIS · CI/CD",
     desc:"Five years of production backend — APIs, data access, caching, and getting releases out safely.",
     hint:"Power it up yourself, part by part", ac:"#84f5ad", g:S.server},
    {k:"trace", cls:"sig", name:"GenAI", contents:"AZURE OPENAI · NL-TO-SQL · RAG · MICROSOFT GRAPH",
     desc:"Two real assistants he built: one turns plain questions into governed SQL, the other gets work done across Teams, Outlook and DevOps.",
     hint:"Pick a path, follow one question end to end", ac:"#f58caf", g:S.packet},
    {k:"gyro",  cls:"sig", name:"Architecture & Security", contents:"RLS · SESSION CONTEXT · EF INTERCEPTORS · AI SEARCH",
     desc:"How the same request returns different data for different people — access enforced inside the database itself, not just in the app.",
     hint:"Tilt to look around · a guided walkthrough", ac:"#bf8cff", g:S.gyro, badge:"TILT"},
    {div:"the person"},
    {k:"hobby", cls:"mini", name:"Hobbies", contents:"WRITING · SINGING · DRAWING · DESIGN · VIDEO",
     desc:"What the engineer does when nothing needs shipping.",
     hint:"A gallery to browse", ac:"#f3cc70", g:S.art},
    {k:"about", cls:"mini", name:"About Madhur", contents:"THE PERSON BEHIND THE SYSTEMS",
     desc:"Why he builds what he builds, and what he is still curious about.",
     hint:"Follow the stars", ac:"#67daf5", g:S.star},
  ];

  const destinations = {
    boot: ['./boot-world.html', 'Power up the stack, one subsystem at a time.'],
    trace: ['./trace-world.html', 'Follow one question through two GenAI projects.'],
    gyro: ['./gyroscope-chamber.html', 'Design the application. Protect its data. Find the information.'],
    hobby: ['./world.html?world=hobbies&experience=portrait', 'Writing, music, games, and the rest of the creative shelf.'],
    about: ['./world.html?world=about&experience=portrait', 'Meet the person behind the systems.']
  };

  function buildTiles(){
    const box = document.getElementById('tiles');
    box.innerHTML='';
    worlds.forEach((w,idx) => {
      if (w.div){
        const d=document.createElement('div'); d.className='divider'; d.textContent=w.div; box.appendChild(d); return;
      }
      const t=document.createElement('a');
      t.href=destinations[w.k][0];
      t.dataset.world=w.k;
      t.className='tile '+w.cls+' tileStagger';
      if(w.k===requestedTile)t.classList.add('is-suggested');
      t.style.setProperty('--ac', w.ac);
      t.innerHTML =
        (w.badge?`<span class="badge" aria-hidden="true">${w.badge}</span>`:"")+
        `<div class="glyph" aria-hidden="true">${w.g}</div>`+
        `<div class="meta"><div class="name" id="world-${w.k}">${w.name}</div><div class="world">${w.contents}</div><div class="tag">${w.desc}</div><div class="hint">${w.hint}</div></div>`+
        `<div class="chev" aria-hidden="true">›</div>`;
      t.setAttribute('aria-labelledby', 'world-'+w.k);
      t.addEventListener('click', event=>{
        if(event.metaKey||event.ctrlKey||event.shiftKey||event.altKey||event.button!==0)return;
        event.preventDefault();openWorld(w,t);
      });
      box.appendChild(t);
      setTimeout(()=>{ t.style.transition='opacity .4s ease,transform .4s ease'; t.style.opacity='1'; t.style.transform='none'; }, reducedMotion?0:60*idx+40);
    });
    requestAnimationFrame(()=>{
      if(requestedTile)box.querySelector(`[data-world="${requestedTile}"]`)?.scrollIntoView({block:'nearest'});
      else box.scrollTop=Number(session.get('mobile-hub-scroll'))||0;
    });
    box.addEventListener('scroll',()=>session.set('mobile-hub-scroll', String(box.scrollTop)),{passive:true});
  }

  function openWorld(w,tile){
    if(enter.classList.contains('show'))return;
    clearTimeout(worldTimer);
    activeTile=tile;
    session.set('mobile-hub-scroll',String(document.getElementById('tiles').scrollTop));
    enter.style.setProperty('--ac', w.ac);
    document.getElementById('enterName').textContent = 'ENTERING ' + w.name.toUpperCase();
    document.getElementById('enterSub').textContent = destinations[w.k][1];
    enter.inert=false;
    enter.classList.add('show');
    hub.inert=true;
    enterBack.focus({preventScroll:true});
    const bar = enter.querySelector('.bar i'); bar.style.animation='none'; void bar.offsetWidth; bar.style.animation='';
    worldTimer=setTimeout(()=>{location.href=destinations[w.k][0];},reducedMotion?120:650);
  }
  function cancelEntry(restoreFocus=true){
    clearTimeout(worldTimer);
    enter.classList.remove('show');enter.inert=true;hub.inert=false;
    if(restoreFocus)activeTile?.focus({preventScroll:true});
  }
  enterBack.addEventListener('click',()=>cancelEntry());
  document.addEventListener('keydown',event=>{
    if(event.key==='Escape'&&enter.classList.contains('show')){event.preventDefault();cancelEntry();}
  });
  addEventListener('pagehide',()=>clearTimeout(worldTimer));
  addEventListener('pageshow',event=>{if(event.persisted)cancelEntry(false);});

  if(params.get('return')==='1'||session.get('mobile-hub-ready')==='1'||reducedMotion)showHub();
  else typeLine();
})();
</script>
</body>
</html>
