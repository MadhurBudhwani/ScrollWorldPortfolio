<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#030711">
  <title>Shatter Lab</title>
  <link rel="stylesheet" href="./world-game.css">
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#02050c;color:#dffcff}
    body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    #stage{position:fixed;inset:0;overflow:hidden;isolation:isolate;cursor:pointer;
      background-color:#02050c;background-repeat:no-repeat;background-position:center;background-size:100% 100%}
    #stage::after{content:'';position:absolute;inset:0;z-index:1;pointer-events:none;
      background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(184,255,234,.026) 3px 4px),
        radial-gradient(ellipse 84% 72% at 50% 48%,transparent 40%,rgba(0,0,0,.54) 100%)}
    .controls{position:fixed;z-index:80;right:max(18px,env(safe-area-inset-right));
      top:max(18px,env(safe-area-inset-top));display:flex;align-items:center;gap:9px}
    .hint{font:600 10px/1 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.13em;
      color:#a5c4c0;text-shadow:0 1px 8px #000}
    #replay{appearance:none;border:1px solid rgba(181,255,228,.36);border-radius:999px;padding:10px 15px;
      background:rgba(4,15,24,.78);backdrop-filter:blur(12px);color:#eafff8;
      font:700 11px/1 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.12em;
      box-shadow:0 8px 30px rgba(0,0,0,.42),inset 0 0 20px rgba(132,245,173,.04);cursor:pointer}
    #replay:hover{border-color:#84f5ad;box-shadow:0 0 22px rgba(132,245,173,.15)}
    #replay:active{transform:translateY(1px)}
    #replay:disabled{opacity:.45;cursor:wait}
    .status{position:fixed;z-index:80;left:max(18px,env(safe-area-inset-left));
      bottom:max(18px,env(safe-area-inset-bottom));font:600 10px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;
      letter-spacing:.14em;color:#73928f;text-transform:uppercase;text-shadow:0 1px 8px #000}
    @media(max-width:600px){.hint{display:none}.controls{right:12px;top:12px}.status{left:12px;bottom:12px}}
  </style>
</head>
<body>
  <main id="stage" aria-label="Glass shatter animation preview"></main>
  <div class="controls">
    <span class="hint">SPACE / R</span>
    <button id="replay" type="button">↻ REPLAY</button>
  </div>
  <div class="status">Shatter lab · click anywhere to replay</div>

  <script src="./world-engine.js"></script>
  <script>
    (()=>{
      const stage=document.getElementById('stage');
      const replay=document.getElementById('replay');
      const source=new Image();
      let snapshot=null,running=false;
      const destination=[
        'radial-gradient(circle at 42% 50%,rgba(132,245,173,.2),transparent 27%)',
        'linear-gradient(115deg,#071522 0%,#0c2630 45%,#07111e 100%)',
        'repeating-linear-gradient(90deg,transparent 0 79px,rgba(132,245,173,.045) 80px)',
        'repeating-linear-gradient(0deg,transparent 0 79px,rgba(132,245,173,.035) 80px)'
      ].join(',');

      function makeSnapshot(){
        const r=stage.getBoundingClientRect();
        const dpr=Math.min(2,devicePixelRatio||1);
        const canvas=document.createElement('canvas');
        canvas.width=Math.max(1,Math.round(r.width*dpr));
        canvas.height=Math.max(1,Math.round(r.height*dpr));
        const c=canvas.getContext('2d');
        c.scale(dpr,dpr);c.imageSmoothingEnabled=false;
        c.fillStyle='#000';c.fillRect(0,0,r.width,r.height);
        const size=r.width,y=(r.height-size)/2;
        c.drawImage(source,0,y,size,size);
        const shade=c.createRadialGradient(r.width*.5,r.height*.48,10,r.width*.5,r.height*.48,Math.max(r.width,r.height)*.7);
        shade.addColorStop(0,'rgba(0,0,0,0)');shade.addColorStop(1,'rgba(0,0,0,.28)');
        c.fillStyle=shade;c.fillRect(0,0,r.width,r.height);
        return canvas.toDataURL('image/webp',.84);
      }

      async function play(){
        if(running||!snapshot)return;
        running=true;replay.disabled=true;
        stage.querySelectorAll('.world-shatter').forEach(node=>node.remove());
        stage.style.backgroundImage=`url(${snapshot})`;
        void stage.offsetWidth;
        const motion=WorldEngine.shatter(stage,{origin:{x:.42,y:.5},tone:'#84f5ad',snapshot,ms:1550,forceMotion:true});
        stage.style.backgroundImage=destination;
        await motion;
        running=false;replay.disabled=false;
      }

      source.onload=()=>{
        snapshot=makeSnapshot();
        stage.style.backgroundImage=`url(${snapshot})`;
        setTimeout(play,550);
      };
      source.src='./assets/worlds/anim/lever-32.webp';
      source.onerror=()=>{stage.style.backgroundImage=destination;};
      replay.addEventListener('click',event=>{event.stopPropagation();play();});
      stage.addEventListener('click',play);
      addEventListener('keydown',event=>{
        if(event.code==='Space'||event.key.toLowerCase()==='r'){event.preventDefault();play();}
      });
      addEventListener('resize',()=>{
        if(!source.complete||!source.naturalWidth)return;
        snapshot=makeSnapshot();
        if(!running)stage.style.backgroundImage=`url(${snapshot})`;
      });
    })();
  </script>
</body>
</html>
