<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>World | Madhur Budhwani</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <script src="./experience-mode.js?v=portrait-routing-2"></script>

  <!-- Bump ?v= whenever any of these change. Injecting them from JS let the
       browser paint the raw page first, which is the white flash that used to
       land at the end of the portal's iris wipe. portrait.css is safe to load
       unconditionally: every rule in it is scoped under .portrait-experience. -->
  <link rel="stylesheet" href="./styles.css?v=boot-1">
  <link rel="stylesheet" href="./world.css?v=boot-1">
  <link rel="stylesheet" href="./lunar-lab.css?v=boot-1">
  <link rel="stylesheet" href="./hobby-gallery.css?v=boot-1">
  <link rel="stylesheet" href="./paged-reader.css?v=boot-1">
  <link rel="stylesheet" href="./about-world.css?v=boot-1">
  <link rel="stylesheet" href="./portrait.css?v=boot-1">

  <style>
    /* Boot screen. Inlined so it survives the first paint without depending on
       any of the stylesheets above. */
    html.booting, html.booting body { overflow: hidden; }
    #worldBoot {
      position: fixed; inset: 0; z-index: 999;
      display: grid; place-content: center; justify-items: center; gap: 22px;
      background: #070d11; color: #a7b9bd; font-family: monospace;
      opacity: 0; visibility: hidden; transition: opacity .45s ease, visibility .45s;
    }
    html.booting #worldBoot { opacity: 1; visibility: visible; }
    #worldBoot::after {
      content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .05;
      background: repeating-linear-gradient(0deg, transparent 0 3px, #d3eee9 3px 4px);
    }
    .wb-rings { position: relative; display: grid; place-items: center; width: 132px; height: 132px; }
    .wb-rings i {
      position: absolute; width: 118px; height: 118px; border-radius: 50%;
      border: 2px solid transparent; border-top-color: #84f5ad;
      animation: wbSpin 1.5s linear infinite;
    }
    .wb-rings i + i { width: 86px; height: 86px; border-top-color: transparent;
      border-left-color: #67daf5; animation-duration: 1.05s; animation-direction: reverse; }
    .wb-name { margin: 0; font: 600 12px/1 monospace; letter-spacing: .2em; color: #84f5ad; }
    .wb-bar { width: 168px; height: 3px; background: #1a2a30; overflow: hidden; }
    .wb-bar i { display: block; width: 0; height: 100%; background: #84f5ad; transition: width .25s ease; }
    @keyframes wbSpin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .wb-rings i { animation: none; } }
  </style>
  <script>
    (function(){
      if (window.mobileRedirect) return;
      window.__v = Math.floor(Date.now()/300000);
      document.documentElement.classList.add('booting');
    })();
  </script>
</head>
<body class="playable-world">
  <div id="worldBoot" role="status" aria-live="polite">
    <div class="wb-rings" aria-hidden="true"><i></i><i></i></div>
    <p class="wb-name" id="worldBootName">ENTERING</p>
    <div class="wb-bar" aria-hidden="true"><i id="worldBootBar"></i></div>
  </div>
  <script>
    /* Named at parse time so the portal's destination is on screen from the
       first frame rather than arriving with the scripts. */
    (function(){
      var names = { work:'WORK EXPERIENCE', genai:'GENAI LAB', hobbies:'HOBBIES', about:'ABOUT MADHUR' };
      var w = new URLSearchParams(location.search).get('world');
      document.getElementById('worldBootName').textContent = 'ENTERING ' + (names[w] || 'THE WORLD');
    })();
  </script>

  <div class="crt" aria-hidden="true"></div>
  <main class="scene-viewport world-viewport" id="sceneViewport" aria-label="Playable portfolio world">
    <div class="stage" id="stage">
      <canvas id="universe" aria-hidden="true"></canvas>
      <div class="player world-avatar" id="worldAvatar" aria-hidden="true"><img src="./assets/madhur-character.png" alt="" width="951" height="1533" decoding="async"></div>
      <canvas id="foreground" aria-hidden="true"></canvas>
    </div>
    <header class="world-hud">
      <a class="world-return" href="./index.html#hub" aria-label="Return to portal hub">← <span>Hub</span></a>
      <div class="world-heading"><p id="worldSubtitle"></p><h1 id="worldTitle"></h1></div>
      <div class="world-tools"><button id="rescueButton" title="Return to the last safe landing">Reset</button><button id="helpButton" title="Pause and view controls">Controls</button></div>
    </header>
    <div class="world-status"><span id="worldStatus" role="status" aria-live="polite"></span><span id="worldFuel" hidden>BOOST <meter min="0" max="1" value="1" aria-label="Jetpack fuel"></meter></span></div>
    <p class="world-keyboard-hint" id="worldHint"></p>
    <div class="world-touch world-movement" role="group" aria-label="Move character">
      <button data-action="left" aria-label="Move left">←</button><button data-action="right" aria-label="Move right">→</button>
    </div>
    <div class="world-touch world-actions" role="group" aria-label="Character actions">
      <button data-action="jump" aria-label="Jump (Space)"><b>↑</b><span>JUMP</span></button>
      <button data-action="power" aria-label="Hold to use power"><b>◇</b><span id="powerLabel">WEB</span></button>
      <button data-action="climb" aria-label="Hold to climb the attached web (W)" disabled><b>⇈</b><span>CLIMB</span></button>
      <button data-action="descend" aria-label="Hold to descend with the jetpack (S)" hidden><b>↓</b><span>DOWN</span></button>
      <button data-action="interact" aria-label="Open nearby exhibit" disabled><b>＋</b><span>OPEN</span></button>
    </div>
    <button id="nearbyExhibit" class="nearby-exhibit" hidden></button>
  </main>
  <dialog id="worldDialog" class="world-dialog" aria-labelledby="dialogTitle">
    <button id="closeDialog" class="dialog-close" aria-label="Close and resume playing">✕</button>
    <p class="dialog-kicker" id="dialogTag"></p><h2 id="dialogTitle"></h2><p id="dialogBody"></p>
    <nav id="dialogLinks" aria-label="Project websites" hidden></nav>
    <div id="dialogDemo" hidden><p>Illustrative local walkthrough</p><ol id="demoSteps"></ol><button id="demoNext">Next step</button></div>
    <section id="lunarLab" hidden aria-label="Interactive lunar experiment">
      <div class="lab-meta"><strong>LOCAL SIMULATION</strong><span>FICTIONAL SAMPLE DATA · NO LIVE SERVICES</span></div>
      <div class="lab-workbench">
        <aside class="lab-inputs" aria-label="Experiment inputs"><div id="labChoices"></div><button id="labRun" type="button">Run experiment</button></aside>
        <div class="lab-display">
          <div class="lab-scene-shell"><canvas id="labScene" width="960" height="360" aria-hidden="true"></canvas></div>
          <ol id="labStages" class="lab-stages" aria-label="Experiment stages"></ol>
          <p id="labStageDetail"></p>
          <div class="lab-controls"><button id="labSkip" type="button" disabled>Skip to result</button><button id="labReplay" type="button" disabled>Replay</button></div>
          <section id="labResult" class="lab-result" hidden aria-labelledby="labResultTitle">
            <h3 id="labResultTitle"></h3><p id="labAnswer"></p><p id="labMetric"></p><div id="labEvidence"></div>
          </section>
        </div>
      </div>
      <details id="labBuild"><summary>How I build this</summary><p id="labSkills"></p><p id="labBuildText"></p><p id="labPrinciple"></p></details>
      <p id="labStatus" class="lab-sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
    </section>
    <p class="dialog-footnote">Close to resume exploring.</p>
  </dialog>
  <script>
    (function(){
      var v = window.__v || Math.floor(Date.now()/300000);
      var files = window.portraitExperience
        ? ['./avatar.js','./companion.js','./paged-reader.js','./lunar-deck.js','./lunar-lab-data.js','./lunar-lab-scene.js','./lunar-lab.js','./about-data.js','./about-scene.js','./about-world.js','./about-blaster.js','./contents/index.js','./hobby-gallery.js','./world-content.js','./portrait-scene.js','./portrait-app.js']
        : ['./orientation.js','./scene-viewport.js','./avatar.js','./companion.js','./paged-reader.js','./lunar-deck.js','./lunar-lab-data.js','./lunar-lab-scene.js','./lunar-lab.js','./about-data.js','./about-scene.js','./about-world.js','./about-blaster.js','./contents/index.js','./hobby-gallery.js','./world-content.js','./world-physics.js','./world-web.js','./world.js'];
      var bar = document.getElementById('worldBootBar');
      var loaded = 0, revealed = false, scheduled = false;

      function uncover(){
        revealed = true;
        document.documentElement.classList.remove('booting');
      }
      function reveal(){
        /* Only uncover() sets `revealed`, so a wait that never completes leaves
           the safety net below still armed. */
        if (revealed || scheduled) return;
        scheduled = true;
        function afterTwoFrames(){
          requestAnimationFrame(function(){ requestAnimationFrame(uncover); });
        }
        /* A background tab never fires rAF, so waiting on it there would hold the
           boot screen until the visitor came back. */
        if (document.hidden) {
          document.addEventListener('visibilitychange', function seen(){
            if (document.hidden) return;
            document.removeEventListener('visibilitychange', seen);
            afterTwoFrames();
          });
          return;
        }
        afterTwoFrames();
      }
      function step(){
        loaded++;
        if (bar) bar.style.width = Math.round(loaded / files.length * 100) + '%';
        if (loaded === files.length) reveal();
      }

      files.forEach(function(f){
        var s = document.createElement('script');
        s.src = f + '?v=' + v; s.async = false;
        s.onload = step; s.onerror = step;
        document.body.appendChild(s);
      });

      /* Never trap a visitor behind the boot screen. This uncovers directly
         rather than through reveal(), whose frame wait is exactly what a stalled
         or hidden page cannot deliver. */
      setTimeout(function(){ if (!revealed) uncover(); }, 8000);
    })();
  </script>
</body>
</html>
